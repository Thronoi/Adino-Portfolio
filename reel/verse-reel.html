<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse Reel – Psalm 46:10 (YouVersion style)</title>
<style>
  /* YouVersion palette */
  :root { --red:#FF3D4D; --neutral:#F6EFEE; --yellow:#F8CB94; --deep:#7A2629; --g40:#353333; --g50:#121212; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; width:1080px; height:1920px; transform-origin:center; overflow:hidden;
    background:var(--g50); font-family:'Inter','Aktiv Grotesk',sans-serif; }
  #warm { position:absolute; inset:0; opacity:0;
    background:radial-gradient(ellipse at 50% 38%, #fff 0%, var(--neutral) 55%, #f1e2dc 100%); }
  #sun { position:absolute; left:50%; top:30%; width:1500px; height:1500px; margin:-750px 0 0 -750px; border-radius:50%; opacity:0;
    background:radial-gradient(circle, rgba(248,203,148,.55), rgba(248,203,148,0) 62%); }
  .layer { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 100px; box-sizing:border-box; }
  /* hook */
  #hook { color:#fff; }
  #hook .l1 { font-weight:700; font-size:150px; letter-spacing:-.02em; line-height:1.05; }
  #hook .l2 { font-weight:500; font-size:78px; line-height:1.2; margin-top:40px; color:#ddd; }
  #hook .l3 { font-weight:500; font-size:56px; line-height:1.35; margin-top:90px; color:var(--yellow); }
  /* scripture */
  #verse { font-family:'Source Serif Pro','Source Serif 4','Liberation Serif',Georgia,serif; font-weight:400; font-size:128px; line-height:1.18; color:var(--g40); }
  #verse .w { display:inline-block; opacity:0; margin:0 .12em; }
  #verse .em { color:var(--red); }
  #ref { margin-top:80px; font-weight:700; font-size:46px; letter-spacing:.22em; text-transform:uppercase; color:var(--red); opacity:0; }
  #ref small { display:block; margin-top:16px; font-weight:500; font-size:30px; letter-spacing:.2em; color:var(--g40); opacity:.7; }
  #bar { width:0; height:6px; background:var(--red); margin:0 auto 70px; border-radius:3px; }
  /* cta */
  #cta { color:var(--g40); opacity:0; }
  #cta .a { font-weight:700; font-size:88px; line-height:1.15; letter-spacing:-.01em; }
  #cta .b { font-weight:500; font-size:46px; margin-top:44px; color:var(--red); }
</style>
</head>
<body>
<div id="stage">
  <div id="warm"></div><div id="sun"></div>
  <div class="layer" id="hook">
    <div class="l1" id="h1">It's 2am.</div>
    <div class="l2" id="h2">Your mind won't stop.</div>
    <div class="l3" id="h3">Prayers. Plans. What‑ifs.<br>All on repeat.</div>
  </div>
  <div class="layer" id="scripture">
    <div id="bar"></div>
    <div id="verse"></div>
    <div id="ref">Psalm 46:10<small>KJV</small></div>
  </div>
  <div class="layer" id="cta">
    <div class="a">Give God a few quiet minutes in Psalm 46 today.</div>
    <div class="b">Open it in the Bible App</div>
  </div>
</div>
<script>
const DURATION = 15;
const TEXT = "Be still, and know that I am God.";
const EMPH = new Set(["still,","God."]);
const $ = id => document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const seg=(t,a,b)=>ease((t-a)/(b-a));
const verse=$('verse');
const words=TEXT.split(' ').map(w=>{const s=document.createElement('span');s.className='w'+(EMPH.has(w)?' em':'');s.textContent=w;verse.appendChild(s);return s;});
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const rise=(el,p,d=36)=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*d}px)`;};

// Pure function of time: live preview and frame-by-frame render share it.
window.setT=function(t){
  // beat 1: hook on dark (0 - 5.4)
  rise($('h1'),seg(t,.1,.7));
  rise($('h2'),seg(t,1.3,2.0));
  rise($('h3'),seg(t,3.0,3.8));
  const hookOut = 1-seg(t,5.0,5.8);
  $('hook').style.opacity = hookOut;
  // beat 2: crossfade to warm light, Scripture (5.4 - 11)
  const warm = seg(t,5.0,6.2);
  $('warm').style.opacity = warm; $('sun').style.opacity = warm*(.85+.15*Math.sin(t));
  $('bar').style.width = 180*seg(t,6.0,6.9)+'px';
  words.forEach((w,i)=>{const s=6.4+i*.5,p=seg(t,s,s+.6);w.style.opacity=p;w.style.transform=`translateY(${(1-p)*30}px)`;});
  $('ref').style.opacity = seg(t,10.0,10.9);
  const scrOut = 1-seg(t,12.0,12.7);
  $('scripture').style.opacity = scrOut;
  // beat 3: gentle CTA (12.3 - 15)
  const c = seg(t,12.4,13.2) * (1-seg(t,14.5,15));
  $('cta').style.opacity=c; $('cta').style.transform=`translateY(${(1-seg(t,12.4,13.2))*30}px)`;
  $('stage').style.filter = 'none';
};
if(!location.search.includes('render')){let t0=performance.now();(function loop(n){setT(((n-t0)/1000)%(DURATION+1));requestAnimationFrame(loop);})(t0);}else setT(0);
</script>
</body>
</html>
